[project]
name = "cs7319-storytelling-scaffold"
version = "0.1.0"
description = "Contribution-ready architecture comparison scaffold; business features are TODOs"
requires-python = ">=3.12"
dependencies = ["streamlit==1.66.1"]

[tool.ruff]
line-length = 100

[project.optional-dependencies]
credentials = ["keyring>=25,<30"]
dev = ["ruff==0.17.3"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"layered/streamlit_app.py" = ["E402"]
"event_based/streamlit_app.py" = ["E402"]
